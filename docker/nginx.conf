# Serve o app e repassa as chamadas para os programas da Receita (mesmo endereco = sem CORS).
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 6m;

  # Os programas Java recusam chamadas com Origin desconhecida (CORS). Como o app e a API
  # estão no mesmo endereço, o nginx tira esse cabeçalho.
  proxy_set_header Origin "";

  location /svc/regime/   { proxy_pass http://regime-regular:8080/api/; proxy_read_timeout 60s; }
  location /svc/simples/  { proxy_pass http://simples-nacional:8082/api/; proxy_read_timeout 60s; }
  location /svc/assistente/ { proxy_pass http://assistente:3000/; proxy_read_timeout 300s; }
  location /svc/danfse/   { proxy_pass http://danfse:8080/; proxy_read_timeout 60s; }

  location = /sw.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
